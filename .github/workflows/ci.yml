name: ci.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Grant execute on mvnw
        run: chmod +x mvnw

      - name: Build & test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        # clean verify = kompilacja + testy unit (surefire) + integracyjne (failsafe).
        # Testcontainers działa bez konfiguracji — runner ubuntu-latest ma Dockera.
        # Jeśli testy integracyjne wymagają Postgresa, użyj Testcontainers albo profilu z H2.

  frontend:
    name: Frontend · Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests (headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build (production)
        run: npm run build
