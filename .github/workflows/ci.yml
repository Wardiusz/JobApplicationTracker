name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend · Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download Maven dependencies
        run: mvn -B dependency:resolve

      - name: Grant execute on mvnw
        run: chmod +x mvnw

      - name: Build & test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Run Trivy (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: backend
          format: sarif
          output: backend-trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'

      - name: Upload Backend SARIF
        if: always() && hashFiles('backend-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend-trivy.sarif

  frontend:
    name: Frontend · Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build (production)
        run: npm run build

      - name: Run Trivy (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: frontend
          format: sarif
          output: frontend-trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: '0'

      - name: Upload Frontend SARIF
        if: always() && hashFiles('frontend-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: frontend-trivy.sarif