<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <img src="/JobTracker.png" alt="logo" class="brand-icon"/>
      <span class="logo-name">Job<strong>Tracker</strong></span>
    </div>

    <nav class="nav">
      <div class="nav-label">Menu</div>

      <div class="nav-item" [class.active]="!showArchived()" (click)="showArchived.set(false)">
        <span class="nav-ico">▦</span>
        Dashboard
        <span class="nav-badge">{{ totalActive() }}</span>
      </div>

      <div class="nav-item" [class.active]="showArchived()" (click)="toggleArchive()">
        <span class="nav-ico">◻</span>
        Archiwum
        <span class="nav-badge">{{ totalArchived() }}</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="avatar">{{ (username() ?? 'U')[0].toUpperCase() }}</div>
        <div>
          <div class="user-name">{{ username() }}</div>
          <div class="user-role">FREE plan</div>
        </div>
        <button type="button" class="btn-settings" routerLink="/settings" title="Ustawienia" aria-label="Ustawienia">⚙</button>
      </div>
      <button type="button" class="btn-logout" (click)="logout()">Wyloguj się</button>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main">
    <header class="topbar">
      <div class="page-title">
        Dashboard
        <span class="page-sub">{{ viewLabel }}</span>
      </div>
      <div class="topbar-right">
        <button class="btn-add" (click)="openAdd()">+ Dodaj ofertę</button>
      </div>
    </header>

    <div class="content">

      <!-- Stats row -->
      <div class="stats-grid">
        <app-stat-card
          label="Wszystkie"
          [value]="totalActive()"
          sub="aplikacje łącznie"
          type="all"
          (clicked)="onStatClick($event)"
        />
        <app-stat-card
          label="Oczekujące"
          [value]="totalPending()"
          sub="w toku"
          type="PENDING"
          (clicked)="onStatClick($event)"
        />
        <app-stat-card
          label="Wstępne rozmowy"
          [value]="totalScreening()"
          sub="odbyto"
          type="SCREENING"
          (clicked)="onStatClick($event)"
        />
        <app-stat-card
          label="Rozmowy rekrutacyjne"
          [value]="totalInterview()"
          sub="przeprowadzono"
          type="INTERVIEW"
          (clicked)="onStatClick($event)"
        />
        <app-stat-card
          label="Oferty"
          [value]="totalOffer()"
          sub="uzyskano"
          type="OFFER"
          (clicked)="onStatClick($event)"
        />
        <app-stat-card
          label="Odrzucone"
          [value]="totalRejected()"
          sub="bez powodzenia"
          type="REJECTED"
          (clicked)="onStatClick($event)"
        />
        <app-stat-card
          label="Ghostowane"
          [value]="totalGhosted()"
          sub="bez odzewu"
          type="GHOSTED"
          (clicked)="onStatClick($event)"
        />
      </div>

      <!-- Filters -->
      <app-filter-bar (filterChange)="onFilterChange($event)" />

      <p-confirmdialog #cd>
        <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
          @if (message) {
            <div class="confirm-dialog">
              <span class="confirm-dialog__header">{{ message.header }}</span>
              <p class="confirm-dialog__message">{{ message.message }}</p>
              <div class="confirm-dialog__actions">
                <button class="btn btn--danger" (click)="onAccept()">Usuń</button>
                <button class="btn btn--outline" (click)="onReject()">Anuluj</button>
              </div>
            </div>
          }
        </ng-template>
      </p-confirmdialog>

      <!-- Table -->
      <app-job-table
        [jobs]="filteredJobs()"
        (editJob)="openEdit($event)"
        (deleteJob)="onDelete($event)"
        (archiveJob)="onArchive($event)"
        (restoreJob)="onRestore($event)"
      />

    </div>
  </div>
</div>

<!-- Modal -->
<app-job-modal
  [isOpen]="modalOpen()"
  [editJob]="editingJob()"
  (save)="onSave($event)"
  (closed)="closeModal()"
/>

<!-- Toast notification -->
<div class="toast" [class.show]="toastShow()" [class.toast--error]="toastType() === 'error'">
  <span class="toast-dot"></span>
  {{ toastMsg() }}
</div>
