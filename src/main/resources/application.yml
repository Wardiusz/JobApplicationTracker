jwt:
    secret: ${DB_SECRET}
    access:
        expiration: 900000
    refresh:
        expiration: 86400000
management:
    endpoints:
        web:
            exposure:
                include: "*"
spring:
    datasource:
        driver-class-name: org.postgresql.Driver
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        url: ${DB_URL}
    flyway:
        enabled: true
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true
    config:
        import: optional:env.properties
    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT}
        username: ${MAIL_ADDRESS}
        password: ${MAIL_PASSWORD}
        properties:
            mail.smtp:
                auth: true
                starttls.enable: true
app:
    cookie:
        secure: ${COOKIE_SECURE:false}
